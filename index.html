<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#1f5fa8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="الرواتب والدوام">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<title>الرواتب والدوام</title>
<style>
:root{
  --bg:#f4f6fa; --card:#fff; --ink:#1b2333; --muted:#6b7487; --line:#e2e6ee;
  --brand:#1f5fa8; --brand-soft:#e7effa; --good:#1e8a4c; --good-soft:#e5f5ec;
  --bad:#c2372f; --bad-soft:#fbeaea; --warn:#a86a00; --warn-soft:#fff4dc;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#11151c; --card:#1a2029; --ink:#e7ebf2; --muted:#98a2b3; --line:#2b3340;
    --brand:#6aa5ea; --brand-soft:#1d2b3e; --good:#4cc283; --good-soft:#16301f;
    --bad:#ef7a72; --bad-soft:#3a1d1c; --warn:#e7b44d; --warn-soft:#33290f;
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,"Noto Sans Arabic",sans-serif;font-size:15px;line-height:1.5}
header{position:sticky;top:0;z-index:20;background:var(--card);border-bottom:1px solid var(--line);padding:calc(env(safe-area-inset-top) + 10px) 16px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px}
header h1{margin:0;font-size:18px;color:var(--brand)}
main{max-width:1100px;margin:0 auto;padding:14px 16px calc(env(safe-area-inset-bottom) + 90px)}
h2{font-size:17px;margin:4px 0 12px}
h3{margin:0;font-size:16px}
/* شريط التنقل السفلي */
#tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:var(--card);border-top:1px solid var(--line);display:flex;justify-content:center;padding-bottom:env(safe-area-inset-bottom)}
#tabs button{flex:1;max-width:140px;border:0;background:none;color:var(--muted);font:inherit;font-size:12px;font-weight:600;padding:8px 2px 7px;display:flex;flex-direction:column;align-items:center;gap:1px;cursor:pointer}
#tabs button i{font-style:normal;font-size:21px;line-height:1.2;filter:grayscale(1);opacity:.7}
#tabs button.on{color:var(--brand)}
#tabs button.on i{filter:none;opacity:1}
/* عناصر الإدخال — min-width:0 يمنع التداخل على iPhone */
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:flex-end}
.row>label,.row>.f{flex:1 1 130px;min-width:0}
label{display:block;font-size:13px;color:var(--muted);min-width:0}
input,select,textarea{display:block;width:100%;min-width:0;max-width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:9px 10px;margin-top:4px;min-height:44px}
input[type=date],input[type=time]{-webkit-appearance:none;appearance:none;text-align:right}
input::-webkit-date-and-time-value{text-align:right}
input:focus,select:focus{outline:2px solid var(--brand);outline-offset:-1px}
input[type=checkbox]{width:22px;height:22px;min-height:0;margin:0;accent-color:var(--brand);flex:0 0 auto;display:inline-block}
.check{display:flex;align-items:center;gap:8px;color:var(--ink);font-size:15px;padding:6px 0;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--card);color:var(--ink);font:inherit;font-weight:600;padding:9px 14px;border-radius:10px;cursor:pointer;white-space:nowrap;min-height:42px;text-decoration:none}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.good{background:var(--good);border-color:var(--good);color:#fff}
.btn.danger{color:var(--bad)}
.btn.sm{padding:4px 10px;font-size:13px;min-height:34px}
.btn.block{width:100%}
.btn:active{transform:scale(.97)}
.time-wrap{display:flex;gap:6px;align-items:flex-end}
.time-wrap input{flex:1}
.time-wrap .btn{min-height:44px}
.muted{color:var(--muted)}
.empty{text-align:center;color:var(--muted);padding:28px 10px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 12px}
.stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
.stat small{color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:12px}
.between{display:flex;justify-content:space-between;align-items:center;gap:8px}
.pill{display:inline-block;font-size:12px;padding:2px 9px;border-radius:99px;background:var(--brand-soft);color:var(--brand);font-weight:600;white-space:nowrap}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
dl{display:grid;grid-template-columns:1fr auto;gap:3px 10px;margin:8px 0;font-variant-numeric:tabular-nums}
dt{color:var(--muted)} dd{margin:0;text-align:left}
.net{display:flex;justify-content:space-between;align-items:center;border-top:1px dashed var(--line);padding-top:8px;margin-top:4px;font-weight:700;font-size:17px}
.pos{color:var(--good)} .neg{color:var(--bad)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:14px;background:var(--card)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
th,td{padding:8px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th{background:var(--brand-soft);font-size:13px}
tfoot td{font-weight:700;background:var(--brand-soft)}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.toolbar .grow{flex:1 1 auto;min-width:0}
.note{font-size:13px;color:var(--muted);margin:6px 0 0}
/* محدد الشهر بالأسهم */
.mp{display:flex;align-items:center;gap:4px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:3px}
.mp button{border:0;background:none;color:var(--brand);font-size:22px;width:40px;height:38px;border-radius:9px;cursor:pointer}
.mp button:active{background:var(--brand-soft)}
.mp span{min-width:110px;text-align:center;font-weight:700}
/* شرائح الموظفين */
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:99px;padding:7px 14px;font:inherit;font-weight:600;cursor:pointer}
.chip.on{background:var(--brand);border-color:var(--brand);color:#fff}
/* قائمة الأيام */
.days{display:flex;flex-direction:column;gap:6px}
.day{display:grid;grid-template-columns:62px 1fr auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px;cursor:pointer;text-align:right;font:inherit;color:inherit;width:100%}
.day:active{background:var(--brand-soft)}
.day .d b{font-size:17px;display:block;line-height:1.1}
.day .d small{color:var(--muted);font-size:12px}
.day.weekend .d b{color:var(--bad)}
.day.holiday{background:var(--warn-soft)}
.day.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}
.day .t{font-variant-numeric:tabular-nums}
.day .r{text-align:left;font-variant-numeric:tabular-nums;font-size:14px}
/* الحضور اليومي */
.person{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.person:last-child{border-bottom:0}
.avatar{width:38px;height:38px;border-radius:50%;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;font-weight:700;flex:0 0 auto}
.person .info{flex:1;min-width:0}
.person .info b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.person .info small{color:var(--muted)}
.list-item{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;cursor:pointer}
.list-item .info{flex:1;min-width:0}
.list-item .info b{display:block}
.list-item .info small{color:var(--muted)}
.more-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.more-grid button{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 10px;font:inherit;font-weight:600;color:var(--ink);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:6px}
.more-grid button i{font-style:normal;font-size:28px}
/* النوافذ: ورقة سفلية على الجوال */
dialog{border:0;border-radius:18px;padding:0;width:min(520px,calc(100vw - 24px));max-height:calc(100dvh - 40px);background:var(--card);color:var(--ink);overflow:auto}
dialog::backdrop{background:rgba(0,0,0,.45)}
@media (max-width:600px){
  dialog{width:100vw;max-width:100vw;margin:auto 0 0;border-radius:18px 18px 0 0;max-height:92dvh}
}
dialog form{padding:16px 16px calc(env(safe-area-inset-bottom) + 16px)}
dialog h3{margin:0 0 12px;font-size:17px}
dialog .row{margin-bottom:10px}
dialog label{margin-bottom:10px}
dialog .row>label{margin-bottom:0}
.actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.actions .btn{flex:1}
details summary{cursor:pointer;color:var(--brand);font-weight:600;padding:6px 0}
.toast{position:fixed;bottom:calc(env(safe-area-inset-bottom) + 76px);left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:60;display:flex;gap:14px;align-items:center;white-space:nowrap}
.toast.show{opacity:1;pointer-events:auto}
.toast button{background:none;border:0;color:var(--brand-soft);font:inherit;font-weight:700;text-decoration:underline;cursor:pointer}
#print{display:none}
.slip{max-width:520px;margin:0 auto}
.slip h2{text-align:center;margin-bottom:2px}
.slip .sub{text-align:center;color:var(--muted);margin-bottom:12px}
@media print{
  body.printing>*:not(#print){display:none!important}
  body.printing #print{display:block}
  body:not(.printing) header, body:not(.printing) #tabs, body:not(.printing) .toolbar, body:not(.printing) .btn{display:none!important}
  .card,.tbl-wrap{border:0}
}
</style>
</head>
<body>
<header>
  <h1>💼 الرواتب والدوام</h1>
  <span class="muted" id="hdrDate"></span>
</header>
<main id="view"></main>
<nav id="tabs">
  <button data-tab="home"><i>🏠</i>الرئيسية</button>
  <button data-tab="attendance"><i>⏱️</i>الدوام</button>
  <button data-tab="payroll"><i>💰</i>الرواتب</button>
  <button data-tab="employees"><i>👥</i>الموظفين</button>
  <button data-tab="more"><i>☰</i>المزيد</button>
</nav>
<dialog id="dlg"></dialog>
<div class="toast" id="toast"></div>
<div id="print"></div>

<script>
"use strict";
/* ========== البيانات ========== */
const KEY = "payroll-app-v1";
const MONTHS = ["يناير","فبراير","مارس","أبريل","مايو","يونيو","يوليو","أغسطس","سبتمبر","أكتوبر","نوفمبر","ديسمبر"];
const WEEKDAYS = ["الأحد","الإثنين","الثلاثاء","الأربعاء","الخميس","الجمعة","السبت"];
const END_REASONS = ["استقالة","فصل","انتهاء عقد","وفاة","أخرى"];
const LEAVE_TYPES = ["سنوية","مرضية","بدون راتب","طارئة","أخرى"];
const DEFAULTS = {
  settings:{ currency:"د.أ", company:"", monthDays:30, otMultiplier:1.25, attReq:"09:00", weekend:5, ssPct:0, annualLeave:14, defIn:"", defOut:"" },
  employees:[], payroll:{}, advances:[], overtime:[], attendance:{}, leaves:[]
};
const normalize = d => ({...structuredClone(DEFAULTS), ...d, settings:{...DEFAULTS.settings, ...(d.settings||{})}, leaves: d.leaves || []});
let db = load();
function load(){
  try{ const d = JSON.parse(localStorage.getItem(KEY) || "null"); if(d) return normalize(d); }catch(e){}
  return structuredClone(DEFAULTS);
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ toast("تعذّر الحفظ في الجهاز"); } }
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2,7);

/* ========== أدوات ========== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const num = v => { const n = parseFloat(String(v ?? "").replace(",", ".")); return isFinite(n) ? n : 0; };
const fix = v => Math.round(v*100)/100;
// الأرقام تُعرض باتجاه LTR حتى تظهر الإشارة السالبة في مكانها الصحيح
const nb = v => `<bdi dir="ltr">${v}</bdi>`;
const fmt2 = v => fix(v).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const moneyText = v => fmt2(v) + " " + db.settings.currency;
const money = v => nb(fmt2(v)) + " " + esc(db.settings.currency);
const pad = n => String(n).padStart(2,"0");
const ym = (y,m) => `${y}-${pad(m)}`;
const now = () => new Date();
const today = () => { const d = now(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const nowHM = () => { const d = now(); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const parseDate = s => { if(!s) return null; const [y,m,d] = s.split("-").map(Number); return Date.UTC(y,m-1,d); };
const DAY = 86400000;
const daysInMonth = (y,m) => new Date(Date.UTC(y,m,0)).getUTCDate();
const toMin = s => { if(!s) return null; const [h,m] = s.split(":").map(Number); return isFinite(h) ? h*60 + (m||0) : null; };
const hmText = mins => { if(mins == null) return ""; const sg = mins < 0 ? "-" : ""; mins = Math.round(Math.abs(mins)); return `${sg}${Math.floor(mins/60)}:${pad(mins%60)}`; };
const hm = mins => mins == null ? "" : nb(hmText(mins));
const initials = n => esc((n||"?").trim().split(/\s+/).map(w=>w[0]).slice(0,2).join(""));
let undoSnap = null;
function toast(t, undo){
  const el = $("#toast");
  el.innerHTML = esc(t) + (undo ? ` <button id="undoBtn">تراجع</button>` : "");
  if(undo) $("#undoBtn").onclick = () => { if(undoSnap){ db = undoSnap; undoSnap = null; save(); render(); toast("تم التراجع"); } };
  el.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(()=>el.classList.remove("show"), undo ? 5000 : 1800);
}
const snapshot = () => { undoSnap = structuredClone(db); };
const empById = id => db.employees.find(e => e.id === id);
const empName = id => empById(id)?.name || "—";
const isActive = (e, dateStr = today()) => { const t = parseDate(e.endDate), h = parseDate(e.hire), d = parseDate(dateStr); return (h==null || h<=d) && (t==null || t>=d); };
function empOptions(sel, onlyActive){
  return db.employees.filter(e => !onlyActive || !e.endDate || e.id === sel)
    .map(e => `<option value="${e.id}" ${e.id===sel?"selected":""}>${esc(e.name)}</option>`).join("");
}
const state = { tab:"home", y:now().getFullYear(), m:now().getMonth()+1, attEmp:null, profile:null, q:"" };
try{ Object.assign(state, JSON.parse(sessionStorage.getItem("payroll-ui")||"{}")); }catch(e){}
const keepUI = () => { try{ sessionStorage.setItem("payroll-ui", JSON.stringify(state)); }catch(e){} };

const monthPicker = yearOnly => `<div class="mp"><button data-mstep="-1" aria-label="السابق">›</button><span>${yearOnly?"":MONTHS[state.m-1]+" "}${state.y}</span><button data-mstep="1" aria-label="التالي">‹</button></div>`;
const onLeaveOn = (empId, ds) => db.leaves.find(l => l.empId===empId && l.from<=ds && (l.to||l.from)>=ds);

/* ========== الإجازات ========== */
// عدد أيام الإجازة (من نوع معيّن اختيارياً) داخل الفترة [start,end]
function leaveDays(empId, start, end, type){
  let n = 0;
  for(const l of db.leaves){
    if(l.empId !== empId || (type && l.type !== type)) continue;
    const a = parseDate(l.from), b = parseDate(l.to || l.from); if(a==null) continue;
    const s = Math.max(a,start), e = Math.min(b,end);
    if(e >= s) n += Math.round((e-s)/DAY) + 1;
  }
  return n;
}
const leaveBalance = (emp, y) => num(db.settings.annualLeave) - leaveDays(emp.id, Date.UTC(y,0,1), Date.UTC(y,11,31), "سنوية");

/* ========== حساب الراتب (مطابق لمعادلات ملف الرواتب + إضافات اختيارية) ========== */
function calcPay(emp, y, m){
  const S = db.settings, MD = num(S.monthDays) || 30;
  const start = Date.UTC(y,m-1,1), end = Date.UTC(y,m-1,daysInMonth(y,m));
  const hire = parseDate(emp.hire), term = parseDate(emp.endDate);
  let days;
  if(hire == null || hire > end) days = 0;
  else if(term != null && term < start) days = 0;
  else days = Math.min(MD, Math.round(((term==null ? end : Math.min(term,end)) - Math.max(hire,start)) / DAY) + 1);
  const salary = num(emp.salary), hrs = num(emp.hours);
  const dayRate = salary / MD, hourRate = hrs ? dayRate / hrs : 0;
  const rec = db.payroll[ym(y,m)]?.[emp.id] || {};
  const absDays = num(rec.absDays), lateHours = num(rec.lateHours), bonus = num(rec.bonus), otherDed = num(rec.otherDed);
  const prefix = ym(y,m);
  const adv = db.advances.filter(a => a.empId===emp.id && a.date?.startsWith(prefix)).reduce((s,a)=>s+num(a.amount),0);
  const otHours = db.overtime.filter(o => o.empId===emp.id && o.date?.startsWith(prefix)).reduce((s,o)=>s+num(o.hours),0);
  const unpaidDays = leaveDays(emp.id, start, end, "بدون راتب");
  const base = dayRate * days;
  const absDed = dayRate * absDays;
  const unpaidDed = dayRate * unpaidDays;
  const lateDed = hourRate * lateHours;
  const otPay = hourRate * otHours * num(S.otMultiplier);
  const ss = base * num(S.ssPct) / 100;
  const deductions = absDed + unpaidDed + lateDed + adv + otherDed + ss;
  return { days, base, absDays, lateHours, absDed, unpaidDays, unpaidDed, lateDed, adv, otHours, otPay, bonus, otherDed, ss, deductions,
           net: base - deductions + otPay + bonus, delivered: !!rec.delivered, deliveredDate: rec.deliveredDate || "", note: rec.note || "" };
}
const otRateFor = emp => { const h = num(emp?.hours); return h ? num(emp.salary)/(num(db.settings.monthDays)||30)/h*num(db.settings.otMultiplier) : 0; };
function empsForMonth(y,m){
  const start = Date.UTC(y,m-1,1), end = Date.UTC(y,m-1,daysInMonth(y,m));
  return db.employees.filter(e => { const h = parseDate(e.hire), t = parseDate(e.endDate); return h!=null && h<=end && (t==null || t>=start); });
}

/* ========== الدوام (مطابق لحاسبة الساعات الإضافية) ========== */
const attKey = (empId,y,m) => `${empId}|${ym(y,m)}`;
const attSheet = (empId,y,m,create) => create ? (db.attendance[attKey(empId,y,m)] ||= {}) : (db.attendance[attKey(empId,y,m)] || {});
const sheetRate = (sheet, emp) => sheet.rate != null && sheet.rate !== "" ? num(sheet.rate) : otRateFor(emp);
function calcDay(sheet, r){
  const a = toMin(r?.in), b = toMin(r?.out);
  if(a == null || b == null) return null;
  const lf = toMin(r.lf), lt = toMin(r.lt);
  const leave = (lf!=null && lt!=null) ? (lt - lf + 1440) % 1440 : (toMin(r.lm) ?? 0);
  const actual = Math.max(((b - a + 1440) % 1440) - leave, 0);
  const req = r.holiday ? 0 : (toMin(r.req) ?? toMin(sheet.req || db.settings.attReq) ?? 0);
  return { actual, req, over: Math.max(actual - req, 0), short: Math.max(req - actual, 0) };
}
function calcAttendance(sheet, y, m, rate){
  const out = { days:{}, actual:0, req:0, over:0, short:0, pay:0, worked:0 };
  for(let d=1; d<=daysInMonth(y,m); d++){
    const c = calcDay(sheet, sheet.days?.[d]); if(!c) continue;
    c.pay = (c.over - c.short) / 60 * rate;
    out.days[d] = c; out.worked++;
    out.actual += c.actual; out.req += c.req; out.over += c.over; out.short += c.short; out.pay += c.pay;
  }
  return out;
}

/* ========== الشاشات ========== */
const views = {};
const needEmp = () => `<div class="card empty">لا يوجد موظفون بعد.<br><br><button class="btn primary" data-act="add-emp">➕ إضافة موظف</button></div>`;

views.home = () => {
  const d = now(), y = d.getFullYear(), m = d.getMonth()+1, day = d.getDate();
  const active = db.employees.filter(e => isActive(e));
  const pays = empsForMonth(y,m).map(e => calcPay(e,y,m));
  const net = pays.reduce((s,p)=>s+p.net,0), undelivered = pays.filter(p=>!p.delivered).length;
  const adv = db.advances.filter(a=>a.date?.startsWith(ym(y,m))).reduce((s,a)=>s+num(a.amount),0);
  const people = active.map(e => {
    const sh = attSheet(e.id,y,m), r = sh.days?.[day] || {};
    let st, btn = "";
    if(onLeaveOn(e.id, today())) st = `<span class="pill warn">في إجازة</span>`;
    else if(r.holiday) st = `<span class="pill warn">عطلة</span>`;
    else if(r.in && r.out) { st = `انصرف ${nb(r.out)} · ${hm(calcDay(sh, r).actual)} ساعة`; btn = `<button class="btn sm" data-day-edit="${e.id}|${day}">تعديل</button>`; }
    else if(r.in) { st = `حاضر منذ ${nb(r.in)}`; btn = `<button class="btn sm primary" data-punch="out|${e.id}">انصراف</button>`; }
    else { st = `<span class="muted">لم يسجّل حضور</span>`; btn = `<button class="btn sm good" data-punch="in|${e.id}">حضور</button>`; }
    return `<div class="person"><div class="avatar">${initials(e.name)}</div><div class="info"><b>${esc(e.name)}</b><small>${st}</small></div>${btn}</div>`;
  }).join("");
  return `
  <div class="stats">
    <div class="stat"><small>موظفون نشطون</small><b>${active.length}</b></div>
    <div class="stat"><small>صافي رواتب ${MONTHS[m-1]}</small><b>${money(net)}</b></div>
    <div class="stat"><small>رواتب لم تُسلَّم</small><b class="${undelivered?"neg":""}">${undelivered}</b></div>
    <div class="stat"><small>سلف هذا الشهر</small><b>${money(adv)}</b></div>
  </div>
  <div class="card">
    <div class="between" style="margin-bottom:4px"><h3>حضور اليوم</h3><span class="muted">${WEEKDAYS[d.getDay()]} ${day} ${MONTHS[m-1]}</span></div>
    ${!db.employees.length ? needEmp() : active.length ? people : `<p class="muted">لا يوجد موظفون نشطون.</p>`}
  </div>
  <div class="card"><h3 style="margin-bottom:10px">إجراءات سريعة</h3>
    <div class="more-grid">
      <button data-act="add-emp"><i>👤</i>موظف جديد</button>
      <button data-act="add-advances"><i>💵</i>سلفة</button>
      <button data-act="add-leaves"><i>🌴</i>إجازة</button>
      <button data-act="add-overtime"><i>⏫</i>ساعات إضافية</button>
    </div></div>`;
};

views.attendance = () => {
  if(!db.employees.length) return needEmp();
  if(!empById(state.attEmp)) state.attEmp = (db.employees.find(e=>isActive(e)) || db.employees[0]).id;
  const {y,m} = state, emp = empById(state.attEmp), sheet = attSheet(emp.id,y,m);
  const res = calcAttendance(sheet, y, m, sheetRate(sheet, emp));
  const isCur = y===now().getFullYear() && m===now().getMonth()+1;
  let list = "";
  for(let d=1; d<=daysInMonth(y,m); d++){
    const r = sheet.days?.[d] || {}, c = res.days[d], wd = new Date(Date.UTC(y,m-1,d)).getUTCDay();
    const lv = onLeaveOn(emp.id, `${ym(y,m)}-${pad(d)}`);
    const mid = (r.in || r.out)
      ? `${nb(r.in||"--:--")} ← ${nb(r.out||"--:--")}${c?` <span class="muted">· ${hm(c.actual)}</span>`:""}`
      : `<span class="muted">${lv ? "إجازة "+esc(lv.type) : r.holiday ? "عطلة" : "اضغط للإدخال"}</span>`;
    const right = c ? (c.over ? `<span class="pos">+${hm(c.over)}</span>` : c.short ? `<span class="neg">−${hm(c.short)}</span>` : `<span class="muted">✓</span>`) : (r.holiday ? `<span class="pill warn">عطلة</span>` : "");
    list += `<button class="day ${r.holiday||lv?"holiday":""} ${wd==db.settings.weekend?"weekend":""} ${isCur&&d===now().getDate()?"today":""}" data-day-edit="${emp.id}|${d}">
      <span class="d"><b>${d}</b><small>${WEEKDAYS[wd]}</small></span><span class="t">${mid}</span><span class="r">${right}</span></button>`;
  }
  return `
  <div class="chips">${db.employees.map(e=>`<button class="chip ${e.id===emp.id?"on":""}" data-att-emp="${e.id}">${esc(e.name)}</button>`).join("")}</div>
  <div class="toolbar">${monthPicker()}<span class="grow"></span><button class="btn sm" data-act="att-settings">⚙️ إعدادات</button></div>
  <div class="stats">
    <div class="stat"><small>أيام مسجّلة</small><b>${res.worked}</b></div>
    <div class="stat"><small>ساعات فعلية</small><b>${hm(res.actual)}</b></div>
    <div class="stat"><small>زيادة / نقص</small><b><span class="pos">${hm(res.over)}</span> / <span class="neg">${hm(res.short)}</span></b></div>
    <div class="stat"><small>الصافي · القيمة</small><b class="${res.pay<0?"neg":"pos"}">${hm(res.over-res.short)} · ${money(res.pay)}</b></div>
  </div>
  <div class="toolbar">
    <button class="btn" data-act="quick-fill">⚡ تعبئة سريعة</button>
    <button class="btn primary" data-act="post-ot">↪️ ترحيل للرواتب</button>
    <button class="btn danger sm" data-act="clear-att">مسح الشهر</button>
  </div>
  <div class="days">${list}</div>`;
};

function payCard(e, p){
  const MD = num(db.settings.monthDays)||30;
  const line = (t,v,cls) => v ? `<dt>${t}</dt><dd class="${cls||""}">${money(v)}</dd>` : "";
  return `<div class="card">
    <div class="between" style="margin-bottom:6px"><div><h3>${esc(e.name)}</h3><span class="muted">${esc(e.title||"")}</span></div>
      <span class="pill ${p.days<MD?"warn":""}">${p.days} يوم</span></div>
    <dl>
      <dt>الراتب الأساسي المستحق</dt><dd>${money(p.base)}</dd>
      ${p.absDays?`<dt>غياب ${nb(fix(p.absDays))} يوم</dt><dd class="neg">${money(p.absDed)}</dd>`:""}
      ${p.unpaidDays?`<dt>إجازة بدون راتب ${p.unpaidDays} يوم</dt><dd class="neg">${money(p.unpaidDed)}</dd>`:""}
      ${p.lateHours?`<dt>تأخير ${nb(fix(p.lateHours))} ساعة</dt><dd class="neg">${money(p.lateDed)}</dd>`:""}
      ${line("السلف",p.adv,"neg")}${line("خصومات أخرى",p.otherDed,"neg")}${line("الضمان الاجتماعي",p.ss,"neg")}
      ${p.otHours?`<dt>إضافي ${nb(fix(p.otHours))} ساعة</dt><dd class="${p.otPay<0?"neg":"pos"}">${money(p.otPay)}</dd>`:""}
      ${line("مكافآت وعلاوات",p.bonus,"pos")}
    </dl>
    <div class="net"><span>الصافي</span><span class="${p.net<0?"neg":""}">${money(p.net)}</span></div>
    <div class="toolbar" style="margin:10px 0 0">
      <button class="btn sm" data-pay-edit="${e.id}">✏️ غياب/تأخير/مكافأة</button>
      <button class="btn sm" data-slip="${e.id}">🧾 القسيمة</button>
      <span class="grow"></span>
      <label class="check"><input type="checkbox" data-deliver="${e.id}" ${p.delivered?"checked":""}> ${p.delivered?`سُلِّم ${esc(p.deliveredDate)}`:"تم التسليم"}</label>
    </div></div>`;
}
views.payroll = () => {

function recordList(kind){

  const isAdv = kind === "advances", prefix = ym(state.y,state.m);
  const rows = db[kind].filter(r => r.date?.startsWith(prefix)).sort((a,b)=>a.date.localeCompare(b.date));
  const total = rows.reduce((s,r)=>s+num(isAdv?r.amount:r.hours),0);
  return `<div class="toolbar"><button class="btn sm" data-go="more">→</button>${monthPicker()}<span class="grow"></span><button class="btn primary" data-act="add-${kind}">➕ ${isAdv?"سلفة":"ساعات"}</button></div>
  <div class="stats"><div class="stat"><small>${isAdv?"إجمالي السلف":"إجمالي الساعات"}</small><b>${isAdv?money(total):nb(fix(total))}</b></div>
    <div class="stat"><small>عدد السجلات</small><b>${rows.length}</b></div></div>
  ${rows.map(r=>`<div class="list-item" data-edit="${kind}:${r.id}"><div class="avatar">${initials(empName(r.empId))}</div>
    <div class="info"><b>${esc(empName(r.empId))}</b><small>${nb(esc(r.date))} ${r.note?"· "+esc(r.note):""}</small></div>
    <b>${isAdv?money(num(r.amount)):nb(fix(num(r.hours)))+" س"}</b></div>`).join("") || `<div class="card empty">لا توجد سجلات في هذا الشهر.</div>`}
  ${!isAdv ? `<p class="note">الساعات السالبة تُخصم بنفس سعر الإضافي. يمكن أيضاً ترحيل الصافي من شاشة الدوام.</p>` : ""}`;
}

function openDialog(html, onSubmit, extraButtons=""){
  const d = $("#dlg");
  d.innerHTML = `<form method="dialog" novalidate>${html}<div class="actions"><button class="btn primary" value="ok">حفظ</button>${extraButtons}<button class="btn" value="cancel">إلغاء</button></div></form>`;
  const f = d.querySelector("form");
  f.onsubmit = ev => {
    const v = ev.submitter?.value;
    if(v === "cancel" || !v) return;
    if(v === "ok" && !f.checkValidity()){ ev.preventDefault(); f.reportValidity(); return; }
    const data = Object.fromEntries(new FormData(f));
    f.querySelectorAll("input[type=checkbox][name]").forEach(c => data[c.name] = c.checked);
    if(onSubmit(data, v) === false) ev.preventDefault();
  };
  d.onclick = ev => { if(ev.target === d) d.close(); };
  d.showModal();
  return f;
}
const timeField = (label, name, val) => `<div class="f"><label>${label}</label><div class="time-wrap"><input type="time" name="${name}" value="${esc(val||"")}"><button type="button" class="btn sm" data-now="${name}">الآن</button></div></div>`;

});

  });
}

function slipHTML(e, y, m){
  const p = calcPay(e,y,m), S = db.settings;
  const L = (t,v) => `<dt>${t}</dt><dd>${money(v)}</dd>`;
  const ded = [p.absDed?L(`غياب (${fix(p.absDays)} يوم)`,p.absDed):"", p.unpaidDed?L(`إجازة بدون راتب (${p.unpaidDays} يوم)`,p.unpaidDed):"",
    p.lateDed?L(`تأخير (${fix(p.lateHours)} س)`,p.lateDed):"", p.adv?L("سلف",p.adv):"", p.otherDed?L("خصومات أخرى",p.otherDed):"",
    p.ss?L(`الضمان الاجتماعي ${S.ssPct}%`,p.ss):"", p.otPay<0?L(`نقص ساعات (${fix(-p.otHours)} س)`,-p.otPay):""].join("");
  return `<div class="slip card">
    <h2>قسيمة راتب</h2><div class="sub">${esc(S.company||"")}${S.company?" · ":""}${MONTHS[m-1]} ${y}</div>
    <dl><dt>الموظف</dt><dd>${esc(e.name)}</dd><dt>المسمى</dt><dd>${esc(e.title||"—")}</dd><dt>أيام الاستحقاق</dt><dd>${p.days}</dd></dl>
    <h3>المستحقات</h3><dl>${L("الراتب الأساسي",p.base)}${p.otPay>0?L(`إضافي (${fix(p.otHours)} س)`,p.otPay):""}${p.bonus?L("مكافآت وعلاوات",p.bonus):""}</dl>
    <h3>الاستقطاعات</h3><dl>${ded || `<dt>لا يوجد</dt><dd></dd>`}</dl>
    <div class="net"><span>صافي الراتب</span><span>${money(p.net)}</span></div>
    ${p.note?`<p class="note">${esc(p.note)}</p>`:""}
    ${p.delivered?`<p class="note">تم التسليم بتاريخ ${esc(p.deliveredDate)}</p>`:""}
    <p class="note" style="margin-top:28px">توقيع الموظف: ____________ &nbsp;&nbsp; توقيع الإدارة: ____________</p></div>`;
}
function slipText(e,y,m){
  const p = calcPay(e,y,m), S = db.settings, L = [];
  L.push(`قسيمة راتب ${MONTHS[m-1]} ${y}${S.company?" — "+S.company:""}`, `الموظف: ${e.name}`, `الراتب الأساسي: ${moneyText(p.base)}`);
  if(p.otPay) L.push(`الإضافي: ${moneyText(p.otPay)}`);
  if(p.bonus) L.push(`مكافآت: ${moneyText(p.bonus)}`);
  if(p.deductions) L.push(`الخصومات: ${moneyText(p.deductions)}${p.adv?` (منها سلف ${moneyText(p.adv)})`:""}`);
  L.push(`الصافي: ${moneyText(p.net)}`);
  return L.join("\n");
}
function showSlip(empId){
  const e = empById(empId), {y,m} = state, d = $("#dlg");
  d.innerHTML = `<form method="dialog">${slipHTML(e,y,m)}<div class="actions">

  d.onclick = ev => { if(ev.target === d) d.close(); };

}

const payRow = (e,y,m,p) => ({"الموظف":e.name,"الشهر":MONTHS[m-1],"السنة":y,"الراتب الشهري":num(e.salary),"أيام الاستحقاق":p.days,"الراتب الأساسي":fix(p.base),"أيام غياب":p.absDays,"خصم غياب":fix(p.absDed),"إجازة بدون راتب (يوم)":p.unpaidDays,"خصمها":fix(p.unpaidDed),"ساعات تأخير":p.lateHours,"خصم تأخير":fix(p.lateDed),"سلفة":fix(p.adv),"خصومات أخرى":fix(p.otherDed),"الضمان":fix(p.ss),"ساعات إضافي":fix(p.otHours),"أجر إضافي":fix(p.otPay),"مكافآت":fix(p.bonus),"إجمالي الخصومات":fix(p.deductions),"الصافي":fix(p.net),"تم التسليم":p.delivered?"✓":"","تاريخ التسليم":p.deliveredDate,"ملاحظة":p.note});
async function exportXlsx(kind){
  toast("جارٍ التجهيز…");
  try{ await loadXLSX(); }catch(e){ return toast("تعذّر تحميل مكتبة Excel — تحقق من الاتصال"); }
  const wb = XLSX.utils.book_new(), add = (rows,name) => { const ws = XLSX.utils.json_to_sheet(rows.length?rows:[{}]); ws["!views"]=[{RTL:true}]; XLSX.utils.book_append_sheet(wb, ws, name); };
  const {y,m} = state; let file;
  if(kind === "month"){
    add(empsForMonth(y,m).map(e=>payRow(e,y,m,calcPay(e,y,m))), "الرواتب");
    file = `رواتب-${MONTHS[m-1]}-${y}.xlsx`;
  }else{
    const yearOf = r => +(r.date||r.from||"").slice(0,4);
    const years = kind==="year" ? [y] : [...new Set([...db.advances,...db.overtime,...db.leaves].map(yearOf).filter(Boolean).concat(y))].sort();
    add(db.employees.map((e,i)=>({"رقم":i+1,"اسم الموظف":e.name,"المسمى الوظيفي":e.title||"","تاريخ التوظيف":e.hire,"الراتب الشهري":num(e.salary),"ساعات العمل اليومية":num(e.hours),"الهاتف":e.phone||"","الرقم الوطني":e.nid||"","تاريخ انتهاء الخدمة":e.endDate||"","سبب الإنهاء":e.endDate?(e.endReason||""):"نشط"})), "الموظفين");
    const pr = []; for(const yy of years) for(let mm=1;mm<=12;mm++) for(const e of empsForMonth(yy,mm)) pr.push(payRow(e,yy,mm,calcPay(e,yy,mm)));
    add(pr, "الرواتب");
    const inYears = r => years.includes(yearOf(r));
    add(db.advances.filter(inYears).map(r=>({"الموظف":empName(r.empId),"التاريخ":r.date,"المبلغ":num(r.amount),"ملاحظات":r.note||""})), "السلف");
    add(db.overtime.filter(inYears).map(r=>({"الموظف":empName(r.empId),"التاريخ":r.date,"ساعات إضافية":num(r.hours),"ملاحظات":r.note||""})), "الإضافي");
    add(db.leaves.filter(inYears).map(l=>({"الموظف":empName(l.empId),"النوع":l.type,"من":l.from,"إلى":l.to||l.from,"الأيام":leaveDays(l.empId,parseDate(l.from),parseDate(l.to||l.from)),"ملاحظات":l.note||""})), "الإجازات");
    file = kind==="year" ? `رواتب-${y}.xlsx` : `رواتب-كل-البيانات.xlsx`;
  }
  XLSX.writeFile(wb, file);
}
function download(name, text){
  const a = document.createElement("a"); a.href = URL.createObjectURL(new Blob([text],{type:"application/json"})); a.download = name; a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

/* ========== التنقل والأحداث ========== */
const TAB_OF = {advances:"more", overtime:"more", leaves:"more", summary:"more", settings:"more", profile:"employees"};
function render(){
  if(!views[state.tab]) state.tab = "home";
  const tab = TAB_OF[state.tab] || state.tab;
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on", b.dataset.tab===tab));
  $("#view").innerHTML = views[state.tab]();
  const d = now(); $("#hdrDate").textContent = `${WEEKDAYS[d.getDay()]} ${d.getDate()} ${MONTHS[d.getMonth()]}`;
  keepUI();
}
function go(tab){ state.tab = tab; render(); window.scrollTo(0,0); }
$("#tabs").onclick = e => { const t = e.target.closest("button")?.dataset.tab; if(t) go(t); };

$("#view").addEventListener("input", e => {
  // البحث يحدّث القائمة فقط دون إعادة رسم حقل البحث (يبقى الكيبورد مفتوحاً)
  if(e.target.matches("[data-search]")){ state.q = e.target.value; $("#empList").innerHTML = empListHTML(); keepUI(); }
});
$("#view").addEventListener("change", e => {
  const t = e.target, ds = t.dataset;
  if(ds.deliver){
    const r = ((db.payroll[ym(state.y,state.m)] ||= {})[ds.deliver] ||= {});
    r.delivered = t.checked; r.deliveredDate = t.checked ? today() : "";
    save(); return render();
  }
  if(ds.set){ db.settings[ds.set] = t.type==="number" || ds.set==="weekend" ? num(t.value) : t.value; save(); return toast("تم الحفظ"); }
  if(ds.actFile === "restore" && t.files[0]){
    t.files[0].text().then(txt => {
      try{ const d = JSON.parse(txt); if(!Array.isArray(d.employees)) throw 0;
        if(!confirm("سيتم استبدال البيانات الحالية بالنسخة الاحتياطية. متابعة؟")) return;
        db = normalize(d); save(); render(); toast("تمت الاستعادة");
      }catch(err){ toast("ملف غير صالح"); }
    });
  }
});

$("#view").addEventListener("click", e => {
  const b = e.target.closest("[data-act],[data-edit],[data-del],[data-go],[data-mstep],[data-att-emp],[data-day-edit],[data-punch],[data-pay-edit],[data-slip],[data-profile]");
  if(!b) return;
  const ds = b.dataset;
  if(ds.go) return go(ds.go);
  if(ds.mstep){
    if(["leaves","summary"].includes(state.tab)) state.y += +ds.mstep;
    else { state.m += +ds.mstep; if(state.m>12){state.m=1;state.y++;} if(state.m<1){state.m=12;state.y--;} }
    return render();
  }
  if(ds.attEmp){ state.attEmp = ds.attEmp; return render(); }
  if(ds.dayEdit){
    const [id,d] = ds.dayEdit.split("|");
    if(state.tab === "home"){ state.y = now().getFullYear(); state.m = now().getMonth()+1; }
    return editDay(id, +d);
  }
  if(ds.punch){
    const [kind,id] = ds.punch.split("|"), d = now();
    const sh = attSheet(id,d.getFullYear(),d.getMonth()+1,true); sh.days ||= {};
    (sh.days[d.getDate()] ||= {})[kind] = nowHM();
    save(); render(); return toast(kind==="in" ? `تم تسجيل حضور ${empName(id)}` : `تم تسجيل انصراف ${empName(id)}`);
  }
  if(ds.payEdit) return editPay(ds.payEdit);
  if(ds.slip){ if(state.tab === "profile"){ state.y = now().getFullYear(); state.m = now().getMonth()+1; } return showSlip(ds.slip); }
  if(ds.profile){ state.profile = ds.profile; return go("profile"); }
  if(ds.edit){
    const [k,id] = ds.edit.split(":");
    return k==="employees" ? editEmployee(id) : k==="leaves" ? editLeave(id) : editRecord(k,id);
  }
  if(ds.del){
    const id = ds.del.split(":")[1];
    if(!confirm(`حذف الموظف «${empName(id)}» وكل سجلاته؟`)) return;
    snapshot();
    db.employees = db.employees.filter(x=>x.id!==id);
    for(const k of ["advances","overtime","leaves"]) db[k] = db[k].filter(x=>x.empId!==id);
    for(const k in db.payroll) delete db.payroll[k][id];
    for(const k in db.attendance) if(k.startsWith(id+"|")) delete db.attendance[k];
    save(); go("employees"); return toast("تم حذف الموظف", true);
  }
  const [act, arg] = (ds.act||"").split(":");
  switch(act){
    case "add-emp": return editEmployee();
    case "add-advances": return editRecord("advances", null, arg);
    case "add-overtime": return editRecord("overtime", null, arg);
    case "add-leaves": return editLeave(null, arg);
    case "att-of": state.attEmp = arg; state.y = now().getFullYear(); state.m = now().getMonth()+1; return go("attendance");
    case "att-settings": return attSettings();
    case "quick-fill": return quickFill();
    case "export-month": return exportXlsx("month");
    case "export-year": return exportXlsx("year");
    case "export-all": return exportXlsx("all");
    case "backup": return download(`نسخة-رواتب-${today()}.json`, JSON.stringify(db, null, 1));
    case "wipe": if(confirm("حذف جميع البيانات نهائياً؟") && confirm("تأكيد أخير: لا يمكن التراجع.")){ db = structuredClone(DEFAULTS); save(); render(); } return;
    case "clear-att": if(confirm("مسح بيانات دوام هذا الشهر للموظف؟")){ snapshot(); delete db.attendance[attKey(state.attEmp,state.y,state.m)]; save(); render(); toast("تم المسح", true); } return;
    case "post-ot": {
      const emp = empById(state.attEmp), {y,m} = state, sh = attSheet(emp.id,y,m);
      const res = calcAttendance(sh, y, m, sheetRate(sh, emp)), hours = fix((res.over - res.short)/60);
      const tag = "من حاسبة الدوام", date = ym(y,m)+"-"+pad(daysInMonth(y,m));
      const exist = db.overtime.find(o => o.empId===emp.id && o.date?.startsWith(ym(y,m)) && o.note===tag);
      if(!confirm(`ترحيل ${hours} ساعة (${hmText(res.over-res.short)}) إلى رواتب ${MONTHS[m-1]}؟${exist?"\nسيتم استبدال الترحيل السابق.":""}`)) return;
      if(exist){ exist.hours = hours; exist.date = date; } else db.overtime.push({id:uid(), empId:emp.id, date, hours, note:tag});
      save(); return toast("تم الترحيل إلى الرواتب");
    }
  }
});

render();
if("serviceWorker" in navigator) navigator.serviceWorker.register("./sw.js").catch(()=>{});
</script>
